name: kalisthenos

# Local dev: only Postgres runs in Docker. The Node app runs on the host via
# `npm run dev` so you get HMR and direct access to logs / breakpoints.
#
# For production deploys (Railway etc.) the Dockerfile is used standalone —
# see `railway.toml`. Compose is purely a local-dev convenience here.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kalisthenos-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: kalisthenos
      POSTGRES_PASSWORD: kalisthenos
      POSTGRES_DB: kalisthenos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kalisthenos-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalisthenos -d kalisthenos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kalisthenos-pg-data:
