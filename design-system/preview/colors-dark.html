<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Dark</title>
<link rel="stylesheet" href="_card.css">
<style>
body { background:#0B0E13; color:#F5F6F4; }
.card-frame { background:#0B0E13; }
.sw .chip { border-color: rgba(245,246,244,0.08); }
.sw .meta .name { color:#F5F6F4; }
.sw .meta .hex  { color:#8A93A0; }
</style>
</head><body>
<div class="card-frame">
  <div class="sw-row">
    <div class="sw"><div class="chip" style="background:#0B0E13"></div><div class="meta"><span class="name">bg</span><span class="hex">#0B0E13</span></div></div>
    <div class="sw"><div class="chip" style="background:#131822"></div><div class="meta"><span class="name">surface</span><span class="hex">#131822</span></div></div>
    <div class="sw"><div class="chip" style="background:#1B2230"></div><div class="meta"><span class="name">surface-2</span><span class="hex">#1B2230</span></div></div>
    <div class="sw"><div class="chip" style="background:#232938"></div><div class="meta"><span class="name">line</span><span class="hex">#232938</span></div></div>
    <div class="sw"><div class="chip" style="background:#C7F23C"></div><div class="meta"><span class="name">accent</span><span class="hex">#C7F23C</span></div></div>
  </div>
</div>
</body></html>
