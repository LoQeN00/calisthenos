<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="_card.css">
<style>
.field { display:flex; flex-direction:column; gap:6px; }
.field label { font:500 10px var(--font-mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
.input { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font:400 14px var(--font-body); width:100%; outline:none; }
.input:focus { border-color: var(--ink); }
.input-search { position:relative; }
.input-search .input { padding-left: 34px; }
.input-search .ico { position:absolute; left:10px; top:50%; transform: translateY(-50%); color: var(--muted); width:16px; height:16px; }
.row-2 { display:grid; grid-template-columns: 1.4fr 1fr; gap:14px; }
</style>
</head><body>
<div class="card-frame">
  <div class="row-2">
    <div class="field">
      <label>Nazwa ćwiczenia</label>
      <input class="input" value="Archer Pull-up">
    </div>
    <div class="field">
      <label>Jednostka</label>
      <input class="input" value="REPS">
    </div>
  </div>
  <div class="field">
    <label>Szukaj</label>
    <div class="input-search">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="input" placeholder="Szukaj po imieniu…">
    </div>
  </div>
</div>
</body></html>
