<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Accent</title>
<link rel="stylesheet" href="_card.css">
<style>
.frame { display:grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 14px; align-items: stretch; }
.hero { background:#C7F23C; border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; justify-content:space-between; min-height:120px; }
.hero .big { font:600 28px/1 var(--font-display); color:#0E1116; letter-spacing:-0.02em; }
.hero .meta { font:500 11px var(--font-mono); color:#0E1116; opacity:.7; text-transform:uppercase; letter-spacing:.08em; }
.alt { border-radius:14px; padding:16px; min-height:120px; display:flex; flex-direction:column; justify-content:space-between; }
.alt .name { font:600 13px var(--font-display); }
.alt .hex { font: 500 11px var(--font-mono); }
</style>
</head><body>
<div class="card-frame">
  <div class="frame">
    <div class="hero">
      <div class="meta">ACCENT · LIMONKOWY</div>
      <div class="big">#C7F23C</div>
      <div class="meta" style="opacity:.55">CTA · brand dot · ring fill</div>
    </div>
    <div class="alt" style="background:#EFFBC4;color:#0E1116">
      <div class="name">accent-soft</div>
      <div class="hex" style="color:#0E1116;opacity:.6">#EFFBC4</div>
    </div>
    <div class="alt" style="background:#FF7A3D;color:#1a0900">
      <div class="name">orange (alt)</div>
      <div class="hex" style="color:#1a0900;opacity:.7">#FF7A3D</div>
    </div>
  </div>
</div>
</body></html>
