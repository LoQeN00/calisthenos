<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type — Mono (JetBrains Mono)</title>
<link rel="stylesheet" href="_card.css">
<style>
.mono { font-family: var(--font-mono); font-feature-settings:"tnum"; }
.frame { display:grid; grid-template-columns: 1fr 1fr; gap:14px 28px; }
.lbl-big { font-family: var(--font-mono); font-size: 10px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:4px; }
.big-num { font-family: var(--font-display); font-weight:600; font-size:28px; letter-spacing:-0.02em; line-height:1; }
.big-num .unit { font-family: var(--font-body); font-size:14px; color:var(--muted); font-weight:500; margin-left:4px; }
.row.tab { gap:12px; }
.tag { font:500 11px var(--font-mono); color:var(--ink-2); background:var(--surface-2); padding:4px 8px; border-radius:6px; }
.eb { font-family:var(--font-mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; }
</style>
</head><body>
<div class="card-frame">
  <div class="frame">
    <div>
      <div class="eb">TRENER · ADAM NIEDŹWIEDŹ</div>
      <div style="font: 600 22px var(--font-display); letter-spacing:-0.02em; margin-top:2px">Pulpit</div>
    </div>
    <div>
      <div class="lbl-big">Sesje · 7 dni</div>
      <div class="big-num">42<span class="unit">setów</span></div>
    </div>
    <div class="row tab">
      <span class="tag">REPS</span>
      <span class="tag">SEC</span>
      <span class="tag">0:42</span>
      <span class="tag">120s</span>
    </div>
    <div class="row tab">
      <span class="mono" style="font-size:13px">5×8 · diff 6.4 · 3 dni temu</span>
    </div>
  </div>
</div>
</body></html>
