<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Top bar</title>
<link rel="stylesheet" href="_card.css">
<style>
.topbar { display:flex; align-items:center; gap:14px; padding:10px 18px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.brand { display:flex; align-items:center; gap:10px; font:700 17px var(--font-display); letter-spacing:-0.02em; }
.brand-mark { width:26px; height:26px; background:var(--ink); color:var(--bg); border-radius:6px; display:grid; place-items:center; font:700 14px var(--font-display); }
.brand-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); }
.spacer { flex:1; }
.icon-btn { width:34px; height:34px; border-radius:8px; background:transparent; border:0; display:grid; place-items:center; color:var(--ink-2); cursor:pointer; }
.icon-btn:hover { background:var(--surface-2); color:var(--ink); }
.userchip { display:flex; align-items:center; gap:10px; padding:4px 10px 4px 4px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); }
.avatar { width:28px; height:28px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; font:600 11px var(--font-display); }
.uname { font:500 12.5px var(--font-body); display:flex; align-items:center; gap:6px; line-height:1.15; }
.urole { font:500 10px var(--font-mono); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:1px; }
</style>
</head><body>
<div class="card-frame tight">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">K</div>
      <span>kalisthenos</span>
      <span class="brand-dot"></span>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" aria-label="Tryb ciemny">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13.5A8.5 8.5 0 0 1 10.5 3 8.5 8.5 0 1 0 21 13.5z"/></svg>
    </button>
    <div class="userchip">
      <div class="avatar">AN</div>
      <div>
        <div class="uname">Adam Niedźwiedź <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted)"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="urole">TRENER</div>
      </div>
    </div>
  </div>
</div>
</body></html>
