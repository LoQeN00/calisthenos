<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sidenav item</title>
<link rel="stylesheet" href="_card.css">
<style>
.sidenav { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 12px; display:flex; flex-direction:column; gap:2px; width: 280px; }
.sect { font:500 11px var(--font-mono); color:var(--muted); letter-spacing:.08em; text-transform:uppercase; padding: 8px 10px 6px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:var(--ink-2); font:500 13.5px var(--font-body); cursor:pointer; border:0; background:transparent; width:100%; text-align:left; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--ink); color: var(--bg); }
.nav-item .ico { width:18px; height:18px; flex-shrink:0; }
.nav-tail { margin-left:auto; font:500 11px var(--font-mono); color:var(--muted); }
.nav-item.active .nav-tail { color: var(--bg); opacity:.6; }
.frame { display:flex; gap: 22px; align-items:center; }
.cap { font:500 11px var(--font-mono); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
</style>
</head><body>
<div class="card-frame">
  <div class="frame">
    <div class="sidenav">
      <div class="sect">Workspace</div>
      <button class="nav-item active">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Pulpit</span>
      </button>
      <button class="nav-item">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.4 3.5-5.5 6.5-5.5s5.8 2.1 6.5 5.5"/><circle cx="17" cy="9" r="2.7"/><path d="M21.5 18.5c-.5-2.6-2.4-4-4.5-4"/></svg>
        <span>Podopieczni</span>
        <span class="nav-tail">4</span>
      </button>
      <button class="nav-item">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4z"/><path d="M10 4h4v16h-4z"/><path d="m16.4 5.2 3.4 1 -3.6 14.5 -3.4-1z"/></svg>
        <span>Biblioteka ćwiczeń</span>
        <span class="nav-tail">15</span>
      </button>
      <button class="nav-item">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/><path d="M8 12h8M8 16h5"/></svg>
        <span>Plany</span>
        <span class="nav-tail">6</span>
      </button>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="cap">Sidenav</div>
      <div style="font-size:12px;color:var(--muted);max-width:240px;line-height:1.5">Active = inverted ink/bg, never accent.<br>Mono tail count, light grey.</div>
    </div>
  </div>
</div>
</body></html>
