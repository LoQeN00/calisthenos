<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type — Eyebrow + Heading</title>
<link rel="stylesheet" href="_card.css">
<style>
.eb { font-family:var(--font-mono); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; }
.h1 { font-family:var(--font-display); font-weight:600; font-size:28px; letter-spacing:-0.02em; line-height:1.1; margin-top:2px; }
.sub { color:var(--muted); font-size:13.5px; margin-top:4px; }
.divider { height:1px; background:var(--line); margin: 18px 0; }
.h2 { font-family:var(--font-display); font-weight:600; font-size:17px; }
.h2-row { display:flex; justify-content:space-between; align-items:baseline; }
.h2-tail { font:500 11px var(--font-mono); color:var(--muted); }
</style>
</head><body>
<div class="card-frame">
  <div>
    <div class="eb">TRENER · ADAM NIEDŹWIEDŹ</div>
    <div class="h1">Pulpit</div>
    <div class="sub">4 aktywnych podopiecznych</div>
  </div>
  <div class="divider"></div>
  <div class="h2-row">
    <div class="h2">Ostatnie sesje</div>
    <div class="h2-tail">12 w tym tygodniu</div>
  </div>
</div>
</body></html>
