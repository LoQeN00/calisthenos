<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Semantic</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card-frame">
  <div class="sw-row">
    <div class="sw"><div class="chip" style="background:#2F9E6A"></div><div class="meta"><span class="name">ok</span><span class="hex">#2F9E6A</span></div></div>
    <div class="sw"><div class="chip" style="background:#E2A23A"></div><div class="meta"><span class="name">warn</span><span class="hex">#E2A23A</span></div></div>
    <div class="sw"><div class="chip" style="background:#E25C3A"></div><div class="meta"><span class="name">danger</span><span class="hex">#E25C3A</span></div></div>
  </div>
  <div class="row" style="gap:14px;margin-top:4px">
    <div class="badge active"><span class="dot"></span>aktywny</div>
    <div class="badge draft"><span class="dot"></span>draft</div>
    <div class="badge archived"><span class="dot"></span>archiwum</div>
  </div>
</div>
</body></html>
