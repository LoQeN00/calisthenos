<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Buttons — Variants</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card-frame">
  <div class="row wrap" style="gap:10px">
    <button class="btn btn-primary">Nowy plan</button>
    <button class="btn btn-dark">Zapisz</button>
    <button class="btn">Anuluj</button>
    <button class="btn btn-ghost">Wszyscy</button>
    <button class="btn btn-danger">Usuń</button>
  </div>
  <div class="row wrap" style="gap:10px">
    <button class="btn btn-primary btn-sm">Dodaj</button>
    <button class="btn btn-sm">Filtruj</button>
    <button class="btn btn-ghost btn-sm">Pokaż wszystkie</button>
    <button class="btn btn-primary btn-lg">Rozpocznij sesję</button>
  </div>
</div>
</body></html>
