<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Badges — Status & Units</title>
<link rel="stylesheet" href="_card.css">
<style>.lbl-row { font:500 10px var(--font-mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; }</style>
</head><body>
<div class="card-frame">
  <div>
    <div class="lbl-row">Status</div>
    <div class="row wrap" style="gap:10px">
      <span class="badge active"><span class="dot"></span>aktywny</span>
      <span class="badge draft"><span class="dot"></span>draft</span>
      <span class="badge archived"><span class="dot"></span>archiwum</span>
    </div>
  </div>
  <div>
    <div class="lbl-row">Unit tag · per-exercise</div>
    <div class="row wrap" style="gap:10px">
      <span class="badge unit-reps"><span class="dot"></span>REPS</span>
      <span class="badge unit-sec"><span class="dot"></span>SEC</span>
    </div>
  </div>
</div>
</body></html>
