<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Icon set</title>
<link rel="stylesheet" href="_card.css">
<style>
.grid { display:grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
.cell { aspect-ratio: 1; border:1px solid var(--line); border-radius: 8px; background:var(--surface); display:grid; place-items:center; color:var(--ink-2); }
.cell svg { width:18px; height:18px; }
.note { font:500 11px var(--font-mono); color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
</style>
</head><body>
<div class="card-frame dense">
  <div class="note">Custom set · 1.75 stroke · round caps · no fills · sized by font-size</div>

    <div class="cell" title="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></div>
