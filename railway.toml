# Railway deploy config. Combined with docker-compose.yml for local dev;
# Railway picks up the Dockerfile automatically for production builds.
#
# Note: Railway's `startCommand` (below) takes precedence over the Dockerfile's
# CMD. They're intentionally kept in sync — if you change one, change the other.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run start"
# `react-router-serve` listens on $PORT (Railway injects this).
healthcheckPath = "/"
# Cold start = migrate + seed + react-router-serve boot. Pierwszy migrate może
# dodatkowo dostać ECONNREFUSED jeśli Postgres jeszcze się nie podniósł i
# kontener musi się raz zrestartować — 30s nie wystarczy.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required environment variables (set in Railway UI):
#   DATABASE_URL          → from the Postgres service binding
#   SESSION_SECRET        → 32+ random chars (run `openssl rand -base64 32`)
#   FILE_SIGNING_SECRET   → 32+ random chars
#   BASE_URL              → https://<your-domain>
#   DATA_DIR              → /data (mount a volume here)
#   NODE_ENV              → production
#
# Note on `citext` extension:
#   The first migration runs `CREATE EXTENSION IF NOT EXISTS citext;` which
#   requires the Postgres role to have superuser privileges. Railway's managed
#   Postgres grants the bound role enough privilege to install citext — verify
#   by running the migration once and checking logs for an error.
